name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version (YY.WW.D.HHMM, Belgrade time)
        run: |
          VERSION=$(TZ=Europe/Belgrade date +'%y.%V.%u.%H%M')
          sed -i "s/const VERSION = 'dev';/const VERSION = '${VERSION}';/" docs/scanner.js
          sed -i "s|<span id=\"ver\">dev</span>|<span id=\"ver\">${VERSION}</span>|" docs/index.html
          grep -q "const VERSION = '${VERSION}';" docs/scanner.js
          grep -q "<span id=\"ver\">${VERSION}</span>" docs/index.html
          echo "Version: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
